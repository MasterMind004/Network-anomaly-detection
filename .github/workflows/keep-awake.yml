
name: Streamlit App Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  check-app:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check Streamlit app
        run: |
          echo "Checking Streamlit app..."
          curl -sS \
            --max-redirs 0 \
            --connect-timeout 15 \
            --max-time 45 \
            -o /tmp/response.html \
            -w "\nHTTP status: %{http_code}\nRedirect URL: %{redirect_url}\n" \
            https://network-anomaly-detection-rauneet.streamlit.app/ \
            || true
          echo "Response preview:"
          head -c 500 /tmp/response.html || true
          echo
