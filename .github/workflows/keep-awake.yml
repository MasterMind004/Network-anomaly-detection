
name: Streamlit App Check

on:
  schedule:
    - cron: "17 */10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-app:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check Streamlit app
        run: |
          curl -sS -L --max-redirs 10 \
            --connect-timeout 15 \
            --max-time 45 \
            -o /dev/null \
            -w "Final HTTP status: %{http_code}\n" \
            https://network-anomaly-detection-rauneet.streamlit.app/
