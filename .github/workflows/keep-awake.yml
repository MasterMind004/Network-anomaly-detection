
name: Streamlit App Keep Awake

on:
  schedule:
    - cron: "17 */10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Streamlit app
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error

          url = "https://network-anomaly-detection-rauneet.streamlit.app/"

          try:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "GitHub-Actions-App-Check"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("HTTP status:", response.status)
                  print("App URL responded successfully.")
          except Exception as error:
              print("App check failed:", error)
              raise
          PY
